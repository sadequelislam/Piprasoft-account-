<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সকল লেনদেনের লেজার - একাউন্টস প্যানেল</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="ledger">

    <!-- লগইন যাচাই হওয়া পর্যন্ত লোডিং -->
    <div id="auth-loading" class="auth-loading">
        <div class="auth-loading-inner">
            <i class="fa-solid fa-spinner fa-spin spinner"></i>
            <p>লগইন যাচাই করা হচ্ছে, অপেক্ষা করুন...</p>
        </div>
    </div>

    <!-- প্রোটেক্টেড অ্যাপ -->
    <div id="app-screen" class="app-container hidden">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar" id="app-topbar"></header>

            <!-- ================= সকল লেনদেন (লেজার) ================= -->
            <div class="card card-table">
                <div class="card-header">
                    <div>
                        <h2><i class="fa-solid fa-book-open"></i> সকল লেনদেনের বিস্তারিত লেজার বিবরণী</h2>
                        <p class="subtitle">অনুমোদনিত আয় ও ব্যয়ের সমন্বিত তালিকা (সবাই দেখতে পারে)</p>
                    </div>
                    <div class="filter-group">
                        <select id="ledger-filter-type">
                            <option value="ALL">সকল লেনদেন</option>
                            <option value="INCOME">শুধুমাত্র জমা (আয়)</option>
                            <option value="EXPENSE">শুধুমাত্র খরচ (ব্যয়)</option>
                            <option value="MY">শুধু আমার এন্ট্রি</option>
                        </select>
                        <button id="btn-export-csv" class="btn btn-secondary btn-sm">
                            <i class="fa-solid fa-file-csv"></i> এক্সপোর্ট (CSV)
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="ledger-table">
                        <thead>
                            <tr>
                                <th>তারিখ</th>
                                <th>ধরন</th>
                                <th>খাত / শিরোনাম</th>
                                <th>বিবরণ / নোট</th>
                                <th>পরিমাণ (৳)</th>
                                <th>যুক্ত করেছেন (এডমিন)</th>
                                <th>অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="ledger-tbody">
                            <tr><td colspan="7" class="text-center">লোড হচ্ছে...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Shared Scripts -->
    <script src="../firebase-config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/data.js"></script>

    <!-- ============ এই পেজের নিজস্ব কোড ============ -->
    <script>
        function onPageReady(user) {
            // ডাটা লোড — বদলালেই টেবিল নতুন করে আঁকা হবে
            initTransactionsListener(renderLedgerPage);

            document.getElementById("ledger-filter-type").addEventListener("change", renderLedgerPage);
            document.getElementById("btn-export-csv").addEventListener("click", exportToCSV);
        }

        function renderLedgerPage() {
            const filterType = document.getElementById("ledger-filter-type").value || "ALL";
            renderLedgerTable("ledger-tbody", filterType);
        }
    </script>
</body>
</html>
