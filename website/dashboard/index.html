<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ড্যাশবোর্ড (হোম) - একাউন্টস প্যানেল</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<!-- data-page: কোন মেনুটা সাইডবারে হাইলাইট হবে -->
<body data-page="dashboard">

    <!-- লগইন যাচাই হওয়া পর্যন্ত লোডিং -->
    <div id="auth-loading" class="auth-loading">
        <div class="auth-loading-inner">
            <i class="fa-solid fa-spinner fa-spin spinner"></i>
            <p>লগইন যাচাই করা হচ্ছে, অপেক্ষা করুন...</p>
        </div>
    </div>

    <!-- প্রোটেক্টেড অ্যাপ -->
    <div id="app-screen" class="app-container hidden">
        <!-- সাইডবার (common.js থেকে অটো বসে) -->
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <!-- টপবার (common.js থেকে অটো বসে) -->
            <header class="top-bar" id="app-topbar"></header>

            <!-- ================= ড্যাশবোর্ডের কন্টেন্ট ================= -->
            <div class="metrics-grid">
                <!-- মেট্রিক ১: মোট জমা -->
                <div class="metric-card income">
                    <div class="metric-icon">
                        <i class="fa-solid fa-arrow-down-long"></i>
                    </div>
                    <div class="metric-details">
                        <h3>মোট জমা (আয়)</h3>
                        <p class="amount">৳ <span id="dash-total-income">0</span></p>
                    </div>
                </div>

                <!-- মেট্রিক ২: মোট খরচ -->
                <div class="metric-card expense">
                    <div class="metric-icon">
                        <i class="fa-solid fa-arrow-up-long"></i>
                    </div>
                    <div class="metric-details">
                        <h3>মোট খরচ (ব্যয়)</h3>
                        <p class="amount">৳ <span id="dash-total-expense">0</span></p>
                    </div>
                </div>

                <!-- মেট্রিক ৩: বর্তমান ক্যাশ -->
                <div class="metric-card balance">
                    <div class="metric-icon">
                        <i class="fa-solid fa-scale-balanced"></i>
                    </div>
                    <div class="metric-details">
                        <h3>বর্তমান ক্যাশ (অবশিষ্ট)</h3>
                        <p class="amount">৳ <span id="dash-current-balance">0</span></p>
                    </div>
                </div>
            </div>

            <!-- সাম্প্রতিক লেনদেন -->
            <div class="card card-table margin-top">
                <div class="card-header">
                    <h2><i class="fa-solid fa-clock-rotate-left"></i> সাম্প্রতিক লেনদেন</h2>
                    <a href="../ledger/" class="btn btn-secondary btn-sm">সব দেখুন <i class="fa-solid fa-arrow-right"></i></a>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>তারিখ</th>
                                <th>ধরন</th>
                                <th>খাত / বিবরণ</th>
                                <th>পরিমাণ</th>
                                <th>এন্ট্রি করেছেন</th>
                            </tr>
                        </thead>
                        <tbody id="recent-transactions-tbody">
                            <tr><td colspan="5" class="text-center">লোড হচ্ছে...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Shared Scripts -->
    <script src="../firebase-config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/data.js"></script>

    <!-- ============ এই পেজের নিজস্ব কোড ============ -->
    <script>
        // লগইন ঠিক থাকলে common.js এই ফাংশনটা ডাকবে
        function onPageReady(user) {
            initTransactionsListener(renderDashboard);
        }

        // ডাটা বদলালেই ড্যাশবোর্ড নতুন করে আঁকা হয়
        function renderDashboard(list) {
            const m = calculateMetrics(list);

            document.getElementById("dash-total-income").innerText = m.totalIncome.toLocaleString("bn-BD");
            document.getElementById("dash-total-expense").innerText = m.totalExpense.toLocaleString("bn-BD");
            document.getElementById("dash-current-balance").innerText = m.balance.toLocaleString("bn-BD");

            renderRecentTransactions("recent-transactions-tbody", list);
        }
    </script>
</body>
</html>
