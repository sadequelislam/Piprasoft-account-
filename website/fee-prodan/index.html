<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফি প্রদান (টাকা জমা) - একাউন্টস প্যানেল</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="fee-prodan">

    <!-- লগইন যাচাই হওয়া পর্যন্ত লোডিং -->
    <div id="auth-loading" class="auth-loading">
        <div class="auth-loading-inner">
            <i class="fa-solid fa-spinner fa-spin spinner"></i>
            <p>লগইন যাচাই করা হচ্ছে, অপেক্ষা করুন...</p>
        </div>
    </div>

    <!-- প্রোটেক্টেড অ্যাপ -->
    <div id="app-screen" class="app-container hidden">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar" id="app-topbar"></header>

            <!-- ================= ফি প্রদান (জমা) ফর্ম ================= -->
            <div class="card form-card">
                <div class="card-header border-income">
                    <h2><i class="fa-solid fa-circle-plus"></i> ফি প্রদান / টাকা জমা করার ফর্ম</h2>
                </div>
                <form id="form-income">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>এডমিন নাম</label>
                            <input type="text" id="inc-name" placeholder="যেমন: রহিম আহমেদ" required>
                        </div>
                        <div class="input-group">
                            <label>টাকার পরিমাণ (৳) *</label>
                            <input type="number" id="inc-amount" min="1" placeholder="যেমন: 5000" required>
                        </div>
                        <div class="input-group">
                            <label>ফি / আয়ের ধরন *</label>
                            <select id="inc-category" required>
                                <option value="মাসিক ফি">মাসিক ফি</option>
                                <option value="ভর্তি ফি">ভর্তি ফি</option>
                                <option value="সার্ভিস চার্জ">সার্ভিস চার্জ</option>
                                <option value="পণ্য বিক্রয়">পণ্য বিক্রয়</option>
                                <option value="অন্যান্য জমা">অন্যান্য জমা</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>তারিখ *</label>
                            <input type="date" id="inc-date" required>
                        </div>
                        <div class="input-group full-width">
                            <label>বিস্তারিত নোট / রসিদ নং (ঐচ্ছিক)</label>
                            <textarea id="inc-note" rows="2" placeholder="অতিরিক্ত বিবরণ বা রসিদ নাম্বার লিখুন..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-check"></i> জমা নিশ্চিত করুন
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Shared Scripts -->
    <script src="../firebase-config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/data.js"></script>

    <!-- ============ এই পেজের নিজস্ব কোড ============ -->
    <script>
        function onPageReady(user) {
            // তারিখের ঘরে আজকের তারিখ বসানো
            document.getElementById("inc-date").value = new Date().toISOString().split("T")[0];

            document.getElementById("form-income").addEventListener("submit", handleIncomeSubmit);
        }

        function handleIncomeSubmit(e) {
            e.preventDefault();

            const newItem = {
                type: "INCOME",
                name: document.getElementById("inc-name").value.trim(),
                amount: parseFloat(document.getElementById("inc-amount").value),
                category: document.getElementById("inc-category").value,
                date: document.getElementById("inc-date").value,
                note: document.getElementById("inc-note").value.trim()
            };

            // সেভ সফল হলে ড্যাশবোর্ডে ফিরে যাওয়া হবে
            saveTransaction(newItem, () => {
                window.location.href = "../dashboard/";
            });
        }
    </script>
</body>
</html>
