<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোন রিকোয়েস্ট - একাউন্টস প্যানেল</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="loan-request">

    <!-- লগইন যাচাই হওয়া পর্যন্ত লোডিং -->
    <div id="auth-loading" class="auth-loading">
        <div class="auth-loading-inner">
            <i class="fa-solid fa-spinner fa-spin spinner"></i>
            <p>লগইন যাচাই করা হচ্ছে, অপেক্ষা করুন...</p>
        </div>
    </div>

    <!-- প্রোটেক্টেড অ্যাপ -->
    <div id="app-screen" class="app-container hidden">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar" id="app-topbar"></header>

            <!-- ================= লোন রিকোয়েস্ট ফর্ম ================= -->
            <div class="card form-card">
                <div class="card-header border-loan">
                    <h2><i class="fa-solid fa-circle-plus"></i> নতুন লোন রিকোয়েস্ট</h2>
                </div>
                <form id="form-loan">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>গ্রহীতার নাম *</label>
                            <input type="text" id="loan-name" placeholder="যেমন: আব্দুল করিম" required>
                        </div>
                        <div class="input-group">
                            <label>লোনের পরিমাণ (৳) *</label>
                            <input type="number" id="loan-amount" min="1" placeholder="যেমন: 20000" required>
                        </div>
                        <div class="input-group">
                            <label>রিকোয়েস্টের তারিখ *</label>
                            <input type="date" id="loan-date" required>
                        </div>
                        <div class="input-group full-width">
                            <label>বিবরণ / লোনের কারণ (ঐচ্ছিক)</label>
                            <textarea id="loan-note" rows="2" placeholder="লোনের উদ্দেশ্য বা শর্তাবলী লিখুন..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-check"></i> রিকোয়েস্ট জমা দিন
                    </button>
                </form>
            </div>

            <!-- ================= সকল লোন রিকোয়েস্টের তালিকা ================= -->
            <div class="card card-table margin-top">
                <div class="card-header">
                    <div>
                        <h2><i class="fa-solid fa-money-check-dollar"></i> সকল লোন রিকোয়েস্ট</h2>
                        <p class="subtitle">অনুমোদন বা পরিশোধের স্ট্যাটাস এখানে হালনাগাদ হবে</p>
                    </div>
                    <div class="filter-group">
                        <select id="loan-filter-status">
                            <option value="ALL">সকল স্ট্যাটাস</option>
                            <option value="PENDING">অপেক্ষমান</option>
                            <option value="APPROVED">অনুমোদিত</option>
                            <option value="PAID">পরিশোধিত</option>
                        </select>
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="loan-table">
                        <thead>
                            <tr>
                                <th>তারিখ</th>
                                <th>গ্রহীতার নাম</th>
                                <th>পরিমাণ (৳)</th>
                                <th>বিবরণ</th>
                                <th>এডমিন</th>
                                <th>স্ট্যাটাস</th>
                                <th>অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="loan-tbody">
                            <tr><td colspan="7" class="text-center">লোড হচ্ছে...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Shared Scripts -->
    <script src="../firebase-config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/data.js"></script>

    <!-- ============ এই পেজের নিজস্ব কোড (লোন ম্যানেজমেন্ট) ============ -->
    <script>
        // লোন রিকোয়েস্টের ডাটা Firebase "loan_requests" কালেকশনে জমা হয়
        // (Firebase না থাকলে localStorage ডেমো মোড)

        const LOAN_STATUS_LABEL = {
            "PENDING": "অপেক্ষমান",
            "APPROVED": "অনুমোদিত",
            "PAID": "পরিশোধিত"
        };
        const LOAN_STATUS_BADGE = {
            "PENDING": "badge-pending",
            "APPROVED": "badge-approved",
            "PAID": "badge-paid"
        };

        let loanRequests = [];

        // লগইন ঠিক থাকলে common.js এই ফাংশনটা ডাকবে
        function onPageReady(user) {
            document.getElementById("loan-date").value = new Date().toISOString().split("T")[0];

            document.getElementById("form-loan").addEventListener("submit", handleLoanSubmit);
            document.getElementById("loan-filter-status").addEventListener("change", renderLoanTable);

            loadLoanRequests();
        }

        // ---------- ডাটা লোড ----------
        function loadLoanRequests() {
            if (firestoreReady()) {
                db.collection("loan_requests").orderBy("createdAt", "desc")
                    .onSnapshot(snapshot => {
                        loanRequests = [];
                        snapshot.forEach(doc => {
                            loanRequests.push({ id: doc.id, ...doc.data() });
                        });
                        renderLoanTable();
                    }, error => {
                        console.error("Loan Listen Error:", error);
                        loadLoansFromLocal();
                    });
            } else {
                loadLoansFromLocal();
            }
        }

        function loadLoansFromLocal() {
            const data = storageGet(LOAN_STORAGE_KEY);
            loanRequests = data ? JSON.parse(data) : [];
            renderLoanTable();
        }

        function saveLoansLocal() {
            storageSet(LOAN_STORAGE_KEY, JSON.stringify(loanRequests));
        }

        // ---------- নতুন রিকোয়েস্ট ----------
        function handleLoanSubmit(e) {
            e.preventDefault();

            const item = {
                borrowerName: document.getElementById("loan-name").value.trim(),
                amount: parseFloat(document.getElementById("loan-amount").value),
                date: document.getElementById("loan-date").value,
                note: document.getElementById("loan-note").value.trim(),
                status: "PENDING",
                requestedBy: getAdminName(),
                createdAt: new Date().toISOString()
            };

            if (firestoreReady()) {
                db.collection("loan_requests").add(item)
                    .then(() => {
                        alert("লোন রিকোয়েস্ট সফলভাবে জমা হয়েছে!");
                        resetLoanForm();
                    })
                    .catch(err => alert("ত্রুটি: " + err.message));
            } else {
                item.id = "local-" + Date.now();
                loanRequests.unshift(item);
                saveLoansLocal();
                alert("লোন রিকোয়েস্ট জমা হয়েছে (ডেমো মোড)!");
                resetLoanForm();
                renderLoanTable();
            }
        }

        function resetLoanForm() {
            document.getElementById("form-loan").reset();
            document.getElementById("loan-date").value = new Date().toISOString().split("T")[0];
        }

        // ---------- স্ট্যাটাস বদলানো ----------
        // newStatus: "APPROVED" (অনুমোদন) বা "PAID" (পরিশোধ সম্পন্ন)
        function updateLoanStatus(id, newStatus) {
            const labels = { "APPROVED": "অনুমোদিত", "PAID": "পরিশোধিত" };

            if (firestoreReady()) {
                db.collection("loan_requests").doc(id).update({ status: newStatus })
                    .then(() => alert("স্ট্যাটাস হালনাগাদ হয়েছে: " + labels[newStatus]))
                    .catch(err => alert("ত্রুটি: " + err.message));
            } else {
                const item = loanRequests.find(l => l.id === id);
                if (item) {
                    item.status = newStatus;
                    saveLoansLocal();
                    alert("স্ট্যাটাস হালনাগাদ হয়েছে: " + labels[newStatus]);
                    renderLoanTable();
                }
            }
        }

        // ---------- মুছে ফেলা ----------
        function deleteLoanRequest(id) {
            if (!confirm("আপনি কি নিশ্চিত যে এই লোন রিকোয়েস্টটি মুছে ফেলতে চান?")) return;

            if (firestoreReady()) {
                db.collection("loan_requests").doc(id).delete()
                    .then(() => alert("লোন রিকোয়েস্ট মুছে ফেলা হয়েছে!"))
                    .catch(err => alert("ত্রুটি: " + err.message));
            } else {
                loanRequests = loanRequests.filter(l => l.id !== id);
                saveLoansLocal();
                alert("লোন রিকোয়েস্ট মুছে ফেলা হয়েছে!");
                renderLoanTable();
            }
        }

        // ---------- টেবিল আঁকা ----------
        function renderLoanTable() {
            const tbody = document.getElementById("loan-tbody");
            if (!tbody) return;

            const filterStatus = document.getElementById("loan-filter-status")?.value || "ALL";
            let filtered = loanRequests;
            if (filterStatus !== "ALL") {
                filtered = loanRequests.filter(l => l.status === filterStatus);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center">কোনো লোন রিকোয়েস্ট পাওয়া যায়নি</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(l => {
                // স্ট্যাটাস অনুযায়ী অ্যাকশন বাটন
                let actionButtons = "";
                if (l.status === "PENDING") {
                    actionButtons += `<button class="btn btn-secondary btn-sm" onclick="updateLoanStatus('${escapeHtml(l.id)}', 'APPROVED')" title="অনুমোদন করুন">
                                        <i class="fa-solid fa-thumbs-up"></i> অনুমোদন
                                      </button> `;
                } else if (l.status === "APPROVED") {
                    actionButtons += `<button class="btn btn-success btn-sm" onclick="updateLoanStatus('${escapeHtml(l.id)}', 'PAID')" title="পরিশোধ সম্পন্ন করুন">
                                        <i class="fa-solid fa-check-double"></i> পরিশোধ
                                      </button> `;
                }
                actionButtons += `<button class="btn btn-outline-danger btn-sm" onclick="deleteLoanRequest('${escapeHtml(l.id)}')" title="মুছে ফেলুন">
                                    <i class="fa-solid fa-trash"></i>
                                  </button>`;

                return `
                    <tr>
                        <td>${escapeHtml(l.date) || '-'}</td>
                        <td><strong>${escapeHtml(l.borrowerName)}</strong></td>
                        <td><strong>৳ ${Number(l.amount || 0).toLocaleString("bn-BD")}</strong></td>
                        <td>${escapeHtml(l.note) || '-'}</td>
                        <td>${escapeHtml(l.requestedBy) || 'এডমিন'}</td>
                        <td>
                            <span class="badge ${LOAN_STATUS_BADGE[l.status] || 'badge-pending'}">
                                ${LOAN_STATUS_LABEL[l.status] || l.status}
                            </span>
                        </td>
                        <td>
                            <div class="action-group">${actionButtons}</div>
                        </td>
                    </tr>
                `;
            }).join("");
        }
    </script>
</body>
</html>
